<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="The ArchiveSense Collection Studio has moved into the public museum experience." />
    <title>ArchiveSense Museum</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      main {
        display: grid;
        min-height: 70vh;
        place-content: center;
        max-width: 760px;
        margin: auto;
        padding: 2rem;
        text-align: center;
      }
      h1 { font-family: var(--display-font); font-size: clamp(2.3rem, 7vw, 4.5rem); line-height: 1.05; }
      .museum-link {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.85rem 1.25rem;
        color: white;
        background: var(--accent-color);
        border-radius: 999px;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <nav class="nav">
      <div class="container"><a href="/">ArchiveSense home</a></div>
    </nav>
    <main>
      <p>Collection Studio</p>
      <h1>The collection is now on exhibit.</h1>
      <p>The earlier collection viewer has evolved into an immersive public museum with curated groupings, guided interpretation, and close artifact inspection.</p>
      <p><a class="museum-link" href="/museum/">Enter the museum</a></p>
    </main>
  </body>
</html>
